name: Build Necro Morselli PSP

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PSP SDK
        run: |
          export PSPSDK=/usr/local/pspdev/psp/sdk
          export PATH="/usr/local/pspdev/bin:$PATH"

          echo "PSPSDK=$PSPSDK" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "=== PSP GCC ==="
          psp-gcc --version

          echo "=== build.mak ==="
          ls -l "$PSPSDK/lib/build.mak"

      - name: Build EBOOT.PBP
        run: |
          sh ./build_psp.sh

          echo "=== EBOOT ==="
          ls -lh EBOOT.PBP

          test -f EBOOT.PBP

      - name: Check ISO tools
        run: |
          echo "=== UMDGen ==="
          command -v umdgen || true
          command -v UMDGenCLI || true

          echo "=== Search PSPDev ==="
          find /usr/local/pspdev \
            -iname '*umdgen*' \
            -o -iname '*umd*gen*' \
            2>/dev/null | head -20

          echo "=== Search system ==="
          find /usr/bin /usr/local/bin \
            -iname '*umdgen*' \
            -o -iname '*umd*gen*' \
            2>/dev/null | head -20

      - name: Build ISO
        run: |
          sh ./build_iso.sh

          echo "=== ISO ==="
          ls -lh Necro_Morselli.iso

          test -f Necro_Morselli.iso

      - name: Upload PSP files
        uses: actions/upload-artifact@v4
        with:
          name: Necro-Morselli-PSP
          path: |
            EBOOT.PBP
            Necro_Morselli.iso
