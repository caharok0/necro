name: Build Necro Morselli PSP

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PSP SDK
        run: |
          export PSPSDK=/usr/local/pspdev/psp/sdk
          export PATH="/usr/local/pspdev/bin:$PATH"

          echo "PSPSDK=$PSPSDK" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "PSPSDK=$PSPSDK"
          psp-gcc --version
          ls -l "$PSPSDK/lib/build.mak"

      - name: Build EBOOT.PBP
        run: |
          make clean || true
          make

          echo "Checking build output:"
          ls -lh EBOOT.elf EBOOT.prx PARAM.SFO EBOOT.PBP

      - name: Prepare ISO tools
        run: |
          mkdir -p tools

          if [ -f build_psp.sh ]; then
            cp build_psp.sh tools/build_psp.sh
            chmod +x tools/build_psp.sh
          fi

          if [ -f build_iso.sh ]; then
            chmod +x build_iso.sh
          fi

          echo "Project files:"
          ls -la
          echo "Tools:"
          ls -la tools

      - name: Package PSP ISO
        run: |
          test -f EBOOT.PBP
          bash build_iso.sh EBOOT.PBP Necro_Morselli.iso

      - name: Check artifacts
        run: |
          ls -lh EBOOT.PBP
          ls -lh Necro_Morselli.iso

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Necro-Morselli-PSP
          path: |
            EBOOT.PBP
            Necro_Morselli.iso
