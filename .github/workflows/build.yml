name: Build Necro Morselli PSP

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PSP SDK
        run: |
          export PSPSDK=/usr/local/pspdev/psp/sdk
          export PATH="/usr/local/pspdev/bin:$PATH"

          echo "PSPSDK=$PSPSDK" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

          psp-gcc --version
          ls -l "$PSPSDK/lib/build.mak"

      - name: Build EBOOT.PBP
        run: |
          sh ./build_psp.sh
          test -f EBOOT.PBP
          ls -lh EBOOT.PBP

      - name: Build ISO
        run: |
          sh ./build_iso.sh
          test -f Necro_Morselli.iso
          ls -lh Necro_Morselli.iso

      - name: Upload PSP files
        uses: actions/upload-artifact@v4
        with:
          name: Necro-Morselli-PSP
          path: |
            EBOOT.PBP
            Necro_Morselli.iso
