name: Build Necro Morselli PSP

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PSP SDK
        run: |
          export PSPSDK=/usr/local/pspdev
          export PATH="$PSPSDK/bin:$PATH"
          echo "PSPSDK=$PSPSDK" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "PSPSDK=$PSPSDK"
          ls -la "$PSPSDK/lib/"

      - name: Build EBOOT.PBP
        run: |
          make clean || true
          make

      - name: Package PSP ISO
        run: |
          bash tools/build_iso.sh EBOOT.PBP Necro_Morselli.iso

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Necro-Morselli-PSP
          path: |
            EBOOT.PBP
            Necro_Morselli.iso
