name: Build PSP EBOOT only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: make clean || true
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: EBOOT-PBP
          path: EBOOT.PBP
